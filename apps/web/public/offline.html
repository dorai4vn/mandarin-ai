<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Mandarin AI</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: #f7f9fd; /* V2 bg.page (D-039, light) */
        color: #18243a; /* V2 fg.default */
        padding: 24px;
      }
      main {
        max-width: 32rem;
      }
      button {
        font: inherit;
        padding: 10px 16px;
        border-radius: 12px;
        border: 0;
        background: #335dff; /* V2 primary.solid */
        color: #fff;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bạn đang offline</h1>
      <p>
        Trang này chưa được lưu để dùng offline. Những trang bạn đã mở trước đó vẫn xem được. Dữ
        liệu học chưa gửi sẽ tự đồng bộ khi có mạng.
      </p>
      <button onclick="location.reload()">Thử lại</button>
    </main>
  </body>
</html>
