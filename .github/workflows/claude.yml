name: Claude Code

# @claude on Issues / PRs (anthropics/claude-code-action).
# Auth: Claude SUBSCRIPTION (Pro/Max) via the CLAUDE_CODE_OAUTH_TOKEN repository secret, created
# by the owner with `claude setup-token` on their own machine. No ANTHROPIC_API_KEY (paid API)
# is used. Requires the Claude GitHub App (https://github.com/apps/claude) on this repository.
#
# The repository is PUBLIC: only trusted people (owner, org members, collaborators) can trigger a
# run, so strangers cannot spend the subscription or inject instructions through a comment.
# Workflows triggered by issue/PR comments always run from the DEFAULT branch (main).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Same toolchain as ci.yml so Claude can run the project's checks.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Subscription auth (Pro/Max) — never an API key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(pnpm install*),Bash(pnpm lint*),Bash(pnpm typecheck*),Bash(pnpm test*),Bash(pnpm build*),Bash(pnpm format*),Bash(pnpm check:*),Bash(pnpm --filter *),Bash(git status*),Bash(git diff*),Bash(git log*)"
            --append-system-prompt "Mandarin AI project rules: communicate in Vietnamese. Never merge a pull request, never deploy to Production, never change Railway / Vercel / Supabase Cloud configuration, never start a new milestone (e.g. M1) unless the owner asks. Never print, request or commit secrets. Do not weaken or skip tests to get green CI. Keep all data-testid attributes. Keep approved design decisions (logo, typography, brand colours, Study Card Blue/Lavender/Mint). Work on a branch and open a PR for review."
