name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guards (secrets, package layering, Expo versions of frozen apps/mobile)
        run: |
          pnpm check:secrets
          pnpm check:deps
          pnpm check:expo
      - name: Fetch handwriting data (pinned sha256, D-029)
        run: pnpm fetch:handwriting-data
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build (packages, API, web, frozen mobile bundle)
        run: pnpm build
      - name: Container images build (generic OCI, Railway candidate)
        run: |
          docker build -f apps/api/Dockerfile -t mandarin-api:ci .
          docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=https://api.invalid -t mandarin-web:ci .

  e2e:
    name: E2E ${{ matrix.engine }} (mobile · tablet · desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fetch:handwriting-data
      - name: Install Playwright browser
        working-directory: apps/web
        timeout-minutes: 14
        # The apt step occasionally hangs on hosted runners (seen twice for WebKit): bound each
        # attempt to 6 minutes and retry once instead of blocking the job for 30 minutes.
        run: |
          for attempt in 1 2; do
            if timeout 360 pnpm exec playwright install --with-deps ${{ matrix.engine }}; then exit 0; fi
            echo "::warning::playwright install attempt $attempt failed or timed out"
          done
          exit 1
      - name: Virtual audio device (runners have no sound card; real computers do)
        if: matrix.engine == 'firefox'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null
          pactl info | grep -E 'Default Sink|Server Name'
      - name: Build API + web (E2E configuration, dev token enabled)
        env:
          NEXT_PUBLIC_ENABLE_DEV_TOKEN: 'true'
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8787
          # E2E only: the local API uses the in-memory MOCK sync store. Never set on Vercel.
          NEXT_PUBLIC_ALLOW_MOCK_SYNC: 'true'
          # Placeholder Auth host: the E2E intercepts it (auth-invite-only.spec.ts). Not a real project.
          NEXT_PUBLIC_SUPABASE_URL: https://supabase-e2e.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_e2e_placeholder
        run: pnpm turbo run build --filter "@mandarin/web..." --filter "@mandarin/api..."
      - name: Playwright
        working-directory: apps/web
        env:
          E2E_ENGINES: ${{ matrix.engine }}
        run: pnpm exec playwright test --trace off
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-${{ matrix.engine }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

  mobile-legacy:
    name: Frozen apps/mobile (Expo) — removed after M0-PWA approval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/*" build
      - name: Expo prebuild (iOS native project generation)
        working-directory: apps/mobile
        run: pnpm prebuild:ios

  database:
    name: Supabase migrations + RLS + invite-only Auth tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase local (Postgres + Auth + Kong + Mailpit; unused services excluded)
        run: pnpm exec supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Apply migrations from scratch
        run: pnpm exec supabase db reset
      - name: RLS tests (pgTAP)
        run: pnpm exec supabase test db
      - name: Schema lint
        run: pnpm exec supabase db lint --level warning --fail-on error
      - name: Auth is invite-only (real local GoTrue, no dev token — D-037)
        run: node scripts/test-auth-invite-only.mjs
